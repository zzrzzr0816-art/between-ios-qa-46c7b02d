name: Device IPA

on:
  workflow_dispatch:
    inputs:
      live_sync:
        type: boolean
        default: false
      preview_login:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  ipa:
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build unsigned device app
        env:
          LIVE_SYNC: ${{ inputs.live_sync }}
          PREVIEW_LOGIN: ${{ inputs.preview_login }}
        run: |
          settings=()
          if [[ "$LIVE_SYNC" == "true" ]]; then
            settings+=(SWIFT_ACTIVE_COMPILATION_CONDITIONS=BETWEEN_LIVE_PLAYTEST PRODUCT_BUNDLE_IDENTIFIER=com.example.between.livetest "INFOPLIST_KEY_CFBundleDisplayName=Between Live Test" CURRENT_PROJECT_VERSION=16)
          elif [[ "$PREVIEW_LOGIN" == "true" ]]; then
            settings+=(SWIFT_ACTIVE_COMPILATION_CONDITIONS=BETWEEN_DEVICE_PREVIEW PRODUCT_BUNDLE_IDENTIFIER=com.example.between.playtest "INFOPLIST_KEY_CFBundleDisplayName=Between Test" CURRENT_PROJECT_VERSION=14)
          fi
          xcodebuild -project Between.xcodeproj -target Between -configuration Release -sdk iphoneos -arch arm64 CONFIGURATION_BUILD_DIR="$RUNNER_TEMP/device-build" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO "${settings[@]}" build > "$RUNNER_TEMP/device-build.log" 2>&1 || { cat "$RUNNER_TEMP/device-build.log"; exit 1; }
      - name: Package unsigned ipa
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$RUNNER_TEMP/device-build/Between.app" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -qry Between-unsigned.ipa Payload
          ls -lh Between-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: Between-unsigned-ipa
          path: ${{ runner.temp }}/Between-unsigned.ipa
          retention-days: 7
